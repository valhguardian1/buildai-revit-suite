      if (!(unitScaleToMetres > 0) || !Number.isFinite(unitScaleToMetres))
        throw new Error('PUSHPIN_VALIDATION_REJECTED | invalid Viewer unit scale.');
      const toleranceViewer = 0.010 / unitScaleToMetres;
      const maxCorrectionViewer = 0.050 / unitScaleToMetres;
      pushpinValidation = validateClashPushpinAnchor(anchor, geometry.bounds,
        secondaryTarget && secondaryTarget.geometry.bounds, toleranceViewer, maxCorrectionViewer,
        sampledTriangleCount, true);
      if (pushpinValidation.outcome === 'UnsafeCoordinateRejected')
        throw new Error('PUSHPIN_VALIDATION_REJECTED | no safe finite Clash anchor.');
      anchor.copy(pushpinValidation.anchor);
      const correctionDistanceMm = pushpinValidation.correctionDistanceViewer * unitScaleToMetres * 1000;
      progress('CLASH_PUSHPIN_VALIDATION | resultKey=' + String(request.resultKey || '').slice(0, 12) +
        ' | revitIntersectionConfirmed=true | sampledTriangleCount=' + sampledTriangleCount +
        ' | insidePrimary=' + String(pushpinValidation.insidePrimary) +
        ' | insideSecondary=' + String(pushpinValidation.insideSecondary) +
        ' | toleranceMm=10 | correctionApplied=' + String(pushpinValidation.correctionApplied) +
        ' | correctionDistanceMm=' + correctionDistanceMm.toFixed(3) +
        ' | outcome=' + pushpinValidation.outcome);
    }

    // Compute one local Clash frame before moving the pin. The same approach
    // vector is then used to expose the pin and to place the camera, guaranteeing
    // that opaque geometry cannot remain between the camera and its target.
    const pairBounds = secondaryTarget
      ? boundsOverlap(geometry.bounds, secondaryTarget.geometry.bounds)
      : null;
    const pairAxis = secondaryTarget
      ? secondaryTarget.geometry.bounds.getCenter(new THREE.Vector3())
          .sub(geometry.bounds.getCenter(new THREE.Vector3()))
      : null;
    const modelCentre = (() => {
      try {
        const box = model.getBoundingBox();
        return box ? box.getCenter(new THREE.Vector3()) : null;
      } catch (e) { return null; }
    })();
    const worldUp = viewer.navigation.getWorldUpVector().clone().normalize();
    const clashCamera = exactIntersection
      ? chooseClashCameraDirection(anchor, pairAxis, worldUp, geometry.bounds,
          secondaryTarget && secondaryTarget.geometry.bounds, resolved.dbId,
          secondaryTarget && secondaryTarget.resolved.dbId, model, secondaryTarget && secondaryTarget.model, modelCentre) : null;
    const cameraDirection = exactIntersection
      ? clashCamera.direction
      : chooseViewDirection(worldUp, pairAxis, anchor, modelCentre, pairBounds || geometry.bounds);

    // Put the pin ON the element, the way ACC does it.
    //
    // Everything above works from bounding boxes: projectPointToSurface falls back
    // to projectPointToAabbSurface whenever the SVF2 triangle buffers are not
    // readable, which on a federated model with linked geometry is every time -
    // "Sampled triangle count: 0" in every log to date. A point on an AABB face is
    // not a point on a pipe, a duct or a sloped slab, so the marker ends up beside
    // the element rather than attached to it, and ACC has no object to navigate to.
    // Dragging the pin by hand fixes it precisely because ACC hit-tests real
    // geometry and snaps onto the surface.
    //
    // So do what ACC does: isolate the element, aim at it, and let the viewer's own
    // raycaster produce the point. A hit is on real geometry by construction, and
    // no outward offset is needed - the marker is a screen-space billboard drawn
    // over the surface, which is how the platform's own pins sit.
    const snapped = exactIntersection ? null : await snapAnchorToGeometry(anchor, cameraDirection, resolved.dbId, geometry.bounds, pairBounds);
    if (exactIntersection) {
      progress('PUSHPIN ANCHOR EXACT INTERSECTION | ' + anchor.toArray().map(v => v.toFixed(6)).join(', '));
    } else if (snapped) {
      anchor.copy(snapped);
      anchorMethod += '/hit-test-snapped';
    } else if (!captureClashCamera) {
      // AR-ST fallback starts at the closest surface in the same Viewer-local
      // frame as the fragment bounds. Walking along the camera ray through a
      // long slab can move the pin several metres from the selected element.
      const bounds = geometry.bounds;
      const surface = projectPointToAabbSurface(anchor, bounds);
      const candidate = surface.clone().add(cameraDirection.clone().normalize()
        .multiplyScalar(PUSHPIN_SURFACE_OFFSET_FT));
      anchor.copy(bounds.distanceToPoint(candidate) <= PUSHPIN_SURFACE_OFFSET_FT + 0.01
        ? candidate : surface);
      anchorMethod += '/nearest-primary-aabb-surface';
    } else {
      // Preserve the established Clash camera and anchor behaviour.
      const outward = cameraDirection;
      const bounds = geometry.bounds;
      const insidePrimary = bounds.containsPoint(anchor);
      if (insidePrimary) {
        const exit = exitDistanceAlong(anchor, outward, bounds);
        if (Number.isFinite(exit)) anchor.add(outward.clone().multiplyScalar(exit));
        else anchor.copy(projectPointToAabbSurface(anchor, bounds));
      }
      anchor.add(outward.clone().multiplyScalar(PUSHPIN_SURFACE_OFFSET_FT));
      anchorMethod += '/surface-offset-0.25ft';
    }

    if (![anchor.x, anchor.y, anchor.z].every(Number.isFinite))
      throw new Error('Surface-aware pushpin anchor contains non-finite coordinates.');
    if (!captureClashCamera &&
        geometry.bounds.distanceToPoint(anchor) > PUSHPIN_SURFACE_OFFSET_FT + 0.01)
      throw new Error('PushpinGeometryUnresolved | AR-ST anchor is outside selected fragment bounds.');

    const surfaceSeparation = primaryProjection && secondaryProjection
      ? primaryProjection.point.distanceTo(secondaryProjection.point)
      : 0;
    const localFocusRadius = request.preferSurfacePairAnchor
      ? Math.min(Math.max(surfaceSeparation * 4, 2.0), 4.0)
      : null;

    // Compute the desired local frame from the final snapped pushpin.
    // Clash captures the actual camera only after selection and stabilization.
    const viewport = buildViewport(
      geometry.bounds, anchor, localFocusRadius, pairBounds, pairAxis, modelCentre, cameraDirection,
      exactIntersection ? clashCamera.distanceFt : null);
    if (!captureClashCamera) {
      let modelBounds = null;
      try { modelBounds = model.getBoundingBox ? model.getBoundingBox() : null; } catch (_) { }
      logArstCoordinateAudit(anchor, viewport, geometry.bounds, modelBounds, anchorMethod, modelGlobalOffset);
    }
    // Select the resolved object in the actual Viewer scene before capturing state.
    // Each batch item starts with clearSelection/showAll above, so selection cannot
    // leak from the previous row. Do not call fitToView or isolate here: the camera
    // and anchor remain controlled by the surface-aware algorithm below.
    const issueCamera = captureClashCamera ? null : arstCameraState(viewport);
    const arstSnapshotId = captureClashCamera ? null : ('arst-' + Date.now() + '-' + resolved.dbId);
    const arstModelDiagonal = model && model.getBoundingBox
      ? (() => { try { const box = model.getBoundingBox(); return box ? box.getSize(new THREE.Vector3()).length() : null; } catch (_) { return null; } })()
      : null;
    // Clash captures through its existing perspective lifecycle. AR-ST applies
    // and validates its legacy viewport only after selection via captureArstCamera.
    // A Clash consists of two objects and may span two loaded Viewer models.
    // setAggregateSelection is the only safe route for that case because dbIds
    // are model-local and may collide between federated models.
    const aggregateSelection = [{ model, ids: [resolved.dbId] }];
    if (request.highlightSecondary && secondaryTarget) {
      const sameModel = secondaryTarget.model === model;
      if (sameModel) {
        if (!aggregateSelection[0].ids.includes(secondaryTarget.resolved.dbId))
          aggregateSelection[0].ids.push(secondaryTarget.resolved.dbId);
      } else {
        aggregateSelection.push({ model: secondaryTarget.model, ids: [secondaryTarget.resolved.dbId] });
      }
    }
    if (typeof viewer.setAggregateSelection === 'function') {
      viewer.setAggregateSelection(aggregateSelection);
    } else if (aggregateSelection.length === 1) {
      viewer.select(aggregateSelection[0].ids, model);
    } else {
      throw new Error('Viewer does not support aggregate selection for a cross-model Clash.');
    }
    viewer.impl.invalidate(true, true, true);
    await delay(60);

    const expectedSelectionCount = aggregateSelection.reduce((sum, item) => sum + item.ids.length, 0);
    let retainedSelectionCount = 0;
    if (typeof viewer.getAggregateSelection === 'function') {
      const retained = viewer.getAggregateSelection() || [];
      for (const expected of aggregateSelection) {
        const actual = retained.find(item => item && item.model === expected.model);
        const ids = actual && Array.isArray(actual.selection) ? actual.selection : [];
        if (!expected.ids.every(id => ids.includes(id)))
          throw new Error('Viewer did not retain every selected Clash dbId before state capture.');
        retainedSelectionCount += expected.ids.length;
      }
    } else {
      const selectedIds = typeof viewer.getSelection === 'function' ? viewer.getSelection(model) : [];
      if (!aggregateSelection[0].ids.every(id => selectedIds.includes(id)))
        throw new Error('Viewer did not retain every selected Clash dbId before state capture.');
      retainedSelectionCount = aggregateSelection[0].ids.length;
    }
    if (retainedSelectionCount !== expectedSelectionCount)
      throw new Error('Viewer retained an incomplete Clash selection.');

    const viewerState = captureClashCamera
      ? await captureIssueCamera(viewport, anchor.toArray())
      : await captureArstCamera(issueCamera, anchor.toArray(), arstModelDiagonal, arstSnapshotId);
    if (!viewerState || !viewerState.objectSet)
      throw new Error('viewer.getState() returned an incomplete state.');

    // Reject a stale navigation state instead of publishing a known bad camera.
    // Selection/render state still comes from Viewer, while all camera geometry
    // and local framing originate from the final pushpin, never the snap camera.
    if (!captureClashCamera) viewerState.viewport = viewerState.viewport;
    progress('CAMERA CAPTURED FROM VIEWER | projection=' + viewerState.viewport.projection +
      '; orthographicHeight=' + viewerState.viewport.orthographicHeight +
      '; fieldOfView=' + viewerState.viewport.fieldOfView);
    progress('CAMERA VERIFIED | computed eye/target/up and local scale retained; snap camera excluded.');
    // getState() may include an AutoCam destination inherited from the initially
    // loaded published view. ACC can restore that destination after viewport and
    // make every Issue appear to use the same camera. The Issue needs the explicit
    // viewport above, not a second competing camera state.
    delete viewerState.autocam;

    // Any section plane left over from an earlier probe in the same batch would be
    // restored with the Issue and could hide the very element it points at.
    viewerState.cutplanes = [];

    // Preserve the model-qualified entries emitted by getState(). Flattening a
    // federated selection into one entry loses the second model and can select an
    // unrelated object when two models reuse the same dbId.
    viewerState.objectSet = viewerState.objectSet
      .filter(entry => entry && Array.isArray(entry.id) && entry.id.length > 0)
      .map(entry => Object.assign({}, entry, {
        isolated: entry.id.slice(),
        hidden: [],
        idType: entry.idType || 'lmv',
        explodeScale: 0,
        explodeOptions: entry.explodeOptions || { magnitude: 4, depthDampening: 0 }
      }));
    const capturedSelectionCount = viewerState.objectSet.reduce((sum, entry) => sum + entry.id.length, 0);
    if (capturedSelectionCount < expectedSelectionCount)
      throw new Error('viewer.getState() omitted one or more selected Clash objects.');

    // Keep the complete coordination model visible as ghosted context around the
    // selected, isolated target.
    // These names deliberately match the keys emitted by Viewer getState().
    viewerState.renderOptions = Object.assign({}, viewerState.renderOptions, {
      appearance: Object.assign({}, (viewerState.renderOptions || {}).appearance, {
        ghostHidden: true,
        displayLines: true,
        ambientShadow: true
      })
    });
    // Position and viewport remain viewer-local in 7.0.19. Preserve the Viewer's
    // original globalOffset unchanged so ACC can restore that local frame; do not
    // add or scale it in this appearance-only patch.
    if (modelGlobalOffset) {
      viewerState.globalOffset = {
        x: modelGlobalOffset.x,
        y: modelGlobalOffset.y,
        z: modelGlobalOffset.z
      };
    }
    let modelToViewerTransform = null;
    let placementTransform = null;
    try { modelToViewerTransform = matrixElements(model.getModelToViewerTransform()); } catch (_) { }
    try { placementTransform = matrixElements(model.getPlacementTransform()); } catch (_) { }

    return {
      dbId: resolved.dbId,
      resolvedExternalId: resolved.externalId,
      mappingDirection: resolved.direction,
      fragmentIds: geometry.fragmentIds,
      boundsMin: pointOrNull(geometry.bounds.min),
      boundsMax: pointOrNull(geometry.bounds.max),
      center: pointOrNull(center),
      anchor: pointOrNull(anchor),
      anchorMethod,
      primarySurfacePoint: primaryProjection ? pointOrNull(primaryProjection.point) : null,
      secondarySurfacePoint: secondaryProjection ? pointOrNull(secondaryProjection.point) : null,
      sampledTriangleCount,
      pushpinValidationOutcome: pushpinValidation ? pushpinValidation.outcome : '',
      insidePrimary: pushpinValidation ? pushpinValidation.insidePrimary : null,
      insideSecondary: pushpinValidation ? pushpinValidation.insideSecondary : null,
      correctionApplied: pushpinValidation ? pushpinValidation.correctionApplied : false,
      correctionDistanceMm: pushpinValidation
        ? pushpinValidation.correctionDistanceViewer * Number(request.viewerUnitScaleToMeters) * 1000 : 0,
      cameraQuality: clashCamera ? clashCamera.quality : '',
      // Without these the AR-ST anchor cannot be reasoned about from a log: whether
      // a surface point sits on the secondary element or merely coincides with the
      // primary's own face is undecidable, and the AABB overlap of the pair - the
      // most plausible place to anchor - cannot be computed at all.
      secondaryBoundsMin: secondaryTarget ? pointOrNull(secondaryTarget.geometry.bounds.min) : null,
      secondaryBoundsMax: secondaryTarget ? pointOrNull(secondaryTarget.geometry.bounds.max) : null,
      secondaryDbId: secondaryTarget ? secondaryTarget.resolved.dbId : 0,
      secondaryLoadedModelId: secondaryTarget
        ? String(secondaryTarget.model.id == null ? '' : secondaryTarget.model.id)
        : '',
      secondaryResolvedExternalId: secondaryTarget ? secondaryTarget.resolved.externalId : '',
      secondaryFragmentIds: secondaryTarget ? secondaryTarget.geometry.fragmentIds : [],
      viewerState,
      stateGlobalOffset: viewerState.globalOffset || null,
      modelGlobalOffset,
      modelToViewerTransform,
      placementTransform,
      loadedViewableGuid: loadedIdentity.guid,
      loadedViewableId: loadedIdentity.viewableId,
      loadedViewableName: loadedIdentity.name,
      derivativeRegion: request.derivativeRegion || '',
      derivativeEndpoint: currentDerivativeEndpoint().endpoint,
      apiFlavor: currentDerivativeEndpoint().apiFlavor,
      isOtg: !!(modelData && modelData.isOTG) || !!otgAvailability.otgNodeFound,
      otgNodeFound: !!otgAvailability.otgNodeFound,
      otgStatus: otgAvailability.otgStatus,
      // Fingerprint of the scene the probe actually worked in. Compare with the ACC
      // session (viewer.model.getFragmentList().getCount() and getInstanceTree()) to
      // prove both sides loaded the same derivative.
      sceneFragmentCount: (function () { try { return model.getFragmentList().getCount(); } catch (_) { return -1; } })(),
      sceneNodeCount: (function () { try { var t = model.getInstanceTree(); return t && t.getNumNodes ? t.getNumNodes() : -1; } catch (_) { return -1; } })(),
      loadedModelId: String(model.id == null ? '' : model.id),
      loadedModelUrn: modelData && modelData.urn ? String(modelData.urn) : '',
      sceneModelCount: sceneModels.length
    };
  }

  async function runProbe(request) {
    return withProbeCamera(async () => {
      const scene = await loadProbeScene(request);
      return resolveLoadedProbe(scene, request);
    });
  }

  async function runProbeBatch(requests) {
    return withProbeCamera(async () => {
    if (!Array.isArray(requests) || requests.length === 0) throw new Error('Viewer probe batch is empty.');
    const scene = await loadProbeScene(requests[0]);
    const outcomes = [];
    for (let index = 0; index < requests.length; index++) {
      if (probeCameraFailure) {
        outcomes.push({ index, result: null, error: probeCameraFailure, stack: '' });
        continue;
      }
      progress('BATCH ITEM BEGIN | index=' + index);
      try {
        const result = await resolveLoadedProbe(scene, requests[index]);
        progress('BATCH ITEM CAPTURED | index=' + index);
        outcomes.push({ index, result, error: '' });
      } catch (error) {
        progress('BATCH ITEM FAILED | index=' + index + '; ' + (error && error.message ? error.message : String(error)));
        outcomes.push({
          index,
          result: null,
          error: 'Batch item ' + index + ': ' + (error && error.message ? error.message : String(error)),
          stack: error && error.stack ? error.stack : ''
        });
      }
    }
    return outcomes;
    });
  }

  window.__startProbe = request => {
    runProbe(request)
      .then(result => post({ type: 'result', result }))
      .catch(error => post({
        type: 'error',
        message: error && error.message ? error.message : String(error),
        stack: error && error.stack ? error.stack : ''
      }));
  };

  window.__startProbeBatch = requests => {
    runProbeBatch(requests)
      .then(outcomes => post({ type: 'batch-result', outcomes }))
      .catch(error => post({
        type: 'error',
        message: error && error.message ? error.message : String(error),
        stack: error && error.stack ? error.stack : ''
      }));
  };

  post({ type: 'ready' });
})();
</script>
</body>
</html>
